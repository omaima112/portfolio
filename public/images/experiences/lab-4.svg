<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6E1F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EED1E6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad4)"/>
  
  <!-- DNA Helix -->
  <g opacity="0.7">
    <!-- Left strand -->
    <path d="M 150 80 Q 140 120, 150 160 Q 160 200, 150 240 Q 140 280, 150 320" 
          stroke="#5A2653" stroke-width="3" fill="none"/>
    
    <!-- Right strand -->
    <path d="M 250 80 Q 260 120, 250 160 Q 240 200, 250 240 Q 260 280, 250 320" 
          stroke="#7E3F74" stroke-width="3" fill="none"/>
    
    <!-- Connectors (base pairs) -->
    <line x1="150" y1="100" x2="250" y2="100" stroke="#A86A9A" stroke-width="2"/>
    <line x1="150" y1="150" x2="250" y2="150" stroke="#A86A9A" stroke-width="2"/>
    <line x1="150" y1="200" x2="250" y2="200" stroke="#A86A9A" stroke-width="2"/>
    <line x1="150" y1="250" x2="250" y2="250" stroke="#A86A9A" stroke-width="2"/>
    <line x1="150" y1="300" x2="250" y2="300" stroke="#A86A9A" stroke-width="2"/>
    
    <!-- Nucleotides -->
    <circle cx="150" cy="100" r="4" fill="#5A2653"/>
    <circle cx="250" cy="100" r="4" fill="#7E3F74"/>
    <circle cx="150" cy="200" r="4" fill="#5A2653"/>
    <circle cx="250" cy="200" r="4" fill="#7E3F74"/>
    <circle cx="150" cy="300" r="4" fill="#5A2653"/>
    <circle cx="250" cy="300" r="4" fill="#7E3F74"/>
  </g>
</svg>