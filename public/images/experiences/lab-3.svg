<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6E1F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EED1E6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad3)"/>
  
  <!-- Petri Dishes -->
  <g>
    <!-- Dish 1 -->
    <circle cx="120" cy="140" r="60" fill="none" stroke="#5A2653" stroke-width="2"/>
    <circle cx="120" cy="140" r="55" fill="#EED1E6" opacity="0.5"/>
    <circle cx="100" cy="130" r="20" fill="#A86A9A" opacity="0.4"/>
    <circle cx="130" cy="145" r="15" fill="#7E3F74" opacity="0.3"/>
    
    <!-- Dish 2 -->
    <circle cx="280" cy="160" r="60" fill="none" stroke="#5A2653" stroke-width="2"/>
    <circle cx="280" cy="160" r="55" fill="#F6E1F0" opacity="0.5"/>
    <circle cx="260" cy="150" r="18" fill="#A86A9A" opacity="0.5"/>
    <circle cx="295" cy="165" r="16" fill="#7E3F74" opacity="0.4"/>
    
    <!-- Dish 3 -->
    <circle cx="200" cy="300" r="60" fill="none" stroke="#5A2653" stroke-width="2"/>
    <circle cx="200" cy="300" r="55" fill="#EED1E6" opacity="0.5"/>
